<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jabil WebAR</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        touch-action: none;
      }

      /* ON-SCREEN DEBUG CONSOLE STYLES */
      #debug-console {
        position: fixed;
        top: 10px;
        left: 10px;
        right: 10px;
        max-height: 150px;
        background: rgba(0, 0, 0, 0.85);
        color: #50fa7b;
        font-family: monospace;
        font-size: 11px;
        padding: 8px;
        border-radius: 6px;
        overflow-y: auto;
        z-index: 99999;
        pointer-events: auto;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      }

      #debug-console div {
        margin-bottom: 3px;
        word-break: break-all;
      }

      .log-error { color: #ff5555 !important; }
      .log-warn { color: #ffb86c !important; }
      .log-info { color: #50fa7b !important; }

      #clear-console-btn {
        position: fixed;
        top: 165px;
        right: 10px;
        z-index: 99999;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 4px;
        padding: 4px 8px;
        font-size: 10px;
        font-family: monospace;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <div id="debug-console"></div>
    <button id="clear-console-btn" onclick="document.getElementById('debug-console').innerHTML=''">Clear Console</button>

    <a-scene 
      id="ar-scene"
      mindar-image="imageTargetSrc: ./assets/tracking-files/targets.mind; filterMinCF: 0.001; filterBeta: 1000;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">

      <a-assets id="ar-assets">
        <a-asset-item id="modelAsset" src="assets/models/jp1.glb" crossorigin="anonymous"></a-asset-item>
      </a-assets>

      <a-light type="ambient" intensity="1.5"></a-light>
      <a-light type="directional" position="1 2 1" intensity="1.5"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false" camera="near: 0.01; far: 10000;"></a-camera>

      <a-entity id="target-entity" mindar-image-target="targetIndex: 0">
        <a-gltf-model id="ar-model" src="#modelAsset" rotation="0 0 0" position="0 0 0" scale="1 1 1"></a-gltf-model>
      </a-entity>

    </a-scene>

    <script>
      // --- ON-SCREEN CONSOLE INTERCEPTOR ---
      const consoleBox = document.getElementById('debug-console');

      function printToUI(msg, type = 'info') {
        if (!consoleBox) return;
        const line = document.createElement('div');
        line.className = `log-${type}`;
        const time = new Date().toLocaleTimeString().split(' ')[0];
        line.textContent = `[${time}] ${msg}`;
        consoleBox.appendChild(line);
        consoleBox.scrollTop = consoleBox.scrollHeight;
      }

      const origLog = console.log;
      const origError = console.error;
      const origWarn = console.warn;

      console.log = (...args) => {
        origLog.apply(console, args);
        printToUI(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'info');
      };

      console.error = (...args) => {
        origError.apply(console, args);
        printToUI(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'error');
      };

      console.warn = (...args) => {
        origWarn.apply(console, args);
        printToUI(args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' '), 'warn');
      };

      window.addEventListener('error', (e) => {
        printToUI(`Uncaught Error: ${e.message}`, 'error');
      });

      console.log('UI Console initialized.');

      // --- AUTOMATIC GITHUB PAGES PATH TESTER ---
      const assetPath = 'assets/models/jp1.glb';
      const absoluteUrl = new URL(assetPath, window.location.href).href;
      console.log(`Checking path: ${absoluteUrl}`);

      fetch(absoluteUrl)
        .then((response) => {
          if (!response.ok) {
            console.error(`HTTP Check Failed! Status: ${response.status} (${response.statusText})`);
          } else {
            const contentLength = response.headers.get('content-length');
            if (contentLength && parseInt(contentLength) < 500) {
              console.warn(`File found but size is only ${contentLength} bytes. This indicates a Git LFS pointer issue.`);
            } else {
              console.log(`HTTP Check Success: 200 OK (${contentLength ? Math.round(contentLength / 1024) + ' KB' : 'File ready'})`);
            }
          }
        })
        .catch((err) => {
          console.error(`Network fetch failed: ${err.message}`);
        });

      // --- AR & MODEL VARIABLES ---
      let isDragging = false;
      let previousTouchX = 0;
      let initialPinchDistance = 0;
      let initialScale = 1;

      const rotationSpeed = 0.5;
      const scaleSpeed = 0.005;

      const sceneEl = document.getElementById('ar-scene');
      const targetEl = document.getElementById('target-entity');
      const model = document.getElementById('ar-model');

      if (model) {
        model.addEventListener('model-loaded', () => {
          console.log('jp1.glb loaded successfully into 3D scene!');
        });

        model.addEventListener('model-error', (e) => {
          console.error('Failed to load jp1.glb into A-Frame.');
        });
      }

      if (targetEl) {
        targetEl.addEventListener('targetFound', () => {
          console.log('Target image detected!');
        });
        targetEl.addEventListener('targetLost', () => {
          console.warn('Target image lost.');
          isDragging = false;
          if (model) {
            model.setAttribute('rotation', '0 0 0');
            model.setAttribute('scale', '1 1 1');
          }
        });
      }

      // --- TOUCH HANDLERS ---
      function getPinchDistance(touch1, touch2) {
        return Math.hypot(touch1.clientX - touch2.clientX, touch1.clientY - touch2.clientY);
      }

      function handleTouchStart(e) {
        if (e.touches.length === 1) {
          isDragging = true;
          previousTouchX = e.touches[0].clientX;
        } else if (e.touches.length === 2) {
          isDragging = false; 
          initialPinchDistance = getPinchDistance(e.touches[0], e.touches[1]);
          if (model) {
            const currentScale = model.getAttribute('scale');
            initialScale = currentScale.x;
          }
        }
      }

      function handleTouchMove(e) {
        if (!model) return;

        if (e.touches.length === 1 && isDragging) {
          const currentTouchX = e.touches[0].clientX;
          const deltaX = currentTouchX - previousTouchX;
          previousTouchX = currentTouchX;

          let rotation = model.getAttribute('rotation');
          rotation.y += deltaX * rotationSpeed;
          model.setAttribute('rotation', rotation);
        } else if (e.touches.length === 2) {
          const currentPinchDistance = getPinchDistance(e.touches[0], e.touches[1]);
          const deltaDistance = currentPinchDistance - initialPinchDistance;

          let newScale = initialScale + (deltaDistance * scaleSpeed);
          newScale = Math.max(0.01, Math.min(newScale, 10.0));

          model.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
        }
      }

      function handleTouchEnd(e) {
        if (e.touches.length === 0) {
          isDragging = false;
        } else if (e.touches.length === 1) {
          isDragging = true;
          previousTouchX = e.touches[0].clientX;
        }
      }

      window.addEventListener('touchstart', handleTouchStart);
      window.addEventListener('touchmove', handleTouchMove, { passive: false });
      window.addEventListener('touchend', handleTouchEnd);

      // --- CLEANUP ---
      function cleanupAR() {
        window.removeEventListener('touchstart', handleTouchStart);
        window.removeEventListener('touchmove', handleTouchMove);
        window.removeEventListener('touchend', handleTouchEnd);

        if (sceneEl) {
          const mindarSystem = sceneEl.systems['mindar-image-system'];
          if (mindarSystem) {
            mindarSystem.stop();
          }

          if (sceneEl.object3D) {
            sceneEl.object3D.traverse((object) => {
              if (object.geometry) object.geometry.dispose();
              if (object.material) {
                if (Array.isArray(object.material)) {
                  object.material.forEach((mat) => disposeMaterial(mat));
                } else {
                  disposeMaterial(object.material);
                }
              }
            });
          }
        }
      }

      function disposeMaterial(material) {
        Object.keys(material).forEach((prop) => {
          if (material[prop] && typeof material[prop].dispose === 'function') {
            material[prop].dispose();
          }
        });
        material.dispose();
      }

      window.addEventListener('beforeunload', cleanupAR);
      window.addEventListener('pagehide', cleanupAR);
    </script>
  </body>
</html>
